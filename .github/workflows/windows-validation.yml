name: windows-full

on:
  push:
    branches:
      - auto/gameplay_update
      - claude/review-project-status-05vxD
    paths:
      - "src/**"
      - "cent-jours-core/**"
      - "tests/**"
      - "addons/**"
      - "project.godot"
      - "tools/run_gdunit_windows.cmd"
      - ".github/workflows/windows-fast.yml"
      - ".github/workflows/windows-heavy-nightly.yml"
      - ".github/workflows/windows-validation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-full:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GODOT_ZIP_URL: https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_win64.exe.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cent-jours-core -> target

      - name: Cache Godot Binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-v4.6.1-stable-win64

      - name: Download Godot Windows binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $godotDir = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "godot")
          $zipPath = Join-Path $godotDir "godot_win64.zip"
          Invoke-WebRequest -Uri $env:GODOT_ZIP_URL -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $godotDir -Force
          Remove-Item $zipPath

      - name: Locate Godot Binary
        shell: pwsh
        run: |
          $godotDir = Join-Path $env:RUNNER_TEMP "godot"
          $exe = Get-ChildItem -Path $godotDir -Filter "Godot_v*_win64.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "Godot Windows binary not found." }
          "GODOT_BINARY=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Godot binary: $exe"

      - name: Windows Rust tests
        shell: pwsh
        working-directory: cent-jours-core
        run: cargo test

      - name: Build Windows GDExtension
        shell: pwsh
        working-directory: cent-jours-core
        run: cargo build --release --features godot-extension

      - name: Run full Godot GdUnit4 regression suite
        shell: cmd
        run: tools\run_gdunit_windows.cmd "%GODOT_BINARY%" res://tests/godot

      - name: Verify smoke scene
        shell: pwsh
        run: |
          & "$env:GODOT_BINARY" --headless --path "$env:GITHUB_WORKSPACE" --scene res://src/dev/engine_smoke_test_scene.tscn > godot_smoke.log 2>&1
          if ($LASTEXITCODE -ne 0) { Get-Content godot_smoke.log; exit $LASTEXITCODE }

      - name: Upload Logs and Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-full-artifacts
          path: |
            reports/
            godot_smoke.log
          if-no-files-found: warn
